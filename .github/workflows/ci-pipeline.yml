
name: Campus Portal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-json-report

      - name: Run automated tests
        id: pytest
        continue-on-error: true
        run: python -m pytest -v --json-report --json-report-file=pytest-report.json

      - name: Send test report to local receiver
        if: always()
        shell: powershell
        run: |
          $testExitCode = "${{ steps.pytest.outcome }}" -eq "success"
          $reportPath = "pytest-report.json"

          if (Test-Path $reportPath) {
            $pytestReport = Get-Content $reportPath -Raw | ConvertFrom-Json
            $summary = $pytestReport.summary
            $passed = if ($null -ne $summary.passed) { $summary.passed } else { 0 }
            $failed = if ($null -ne $summary.failed) { $summary.failed } else { 0 }
            $errors = if ($null -ne $summary.error) { $summary.error } else { 0 }
            $skipped = if ($null -ne $summary.skipped) { $summary.skipped } else { 0 }

            $body = @{
              status = if ($testExitCode) { "SUCCESS" } else { "FAILURE" }
              repository = "${{ github.repository }}"
              workflow = "${{ github.workflow }}"
              run_id = "${{ github.run_id }}"
              run_number = "${{ github.run_number }}"
              branch = "${{ github.ref_name }}"
              test_result = "$passed passed, $failed failed, $errors errors, $skipped skipped"
              tests_passed = $passed
              tests_failed = $failed
              tests_errors = $errors
              tests_skipped = $skipped
            } | ConvertTo-Json -Depth 5

            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:5001/report" -Method Post -ContentType "application/json" -Body $body
            } catch {
              Write-Error "Could not send report to local receiver: $_"
              exit 1
            }
          } else {
            Write-Error "pytest-report.json was not generated."
            exit 1
          }

      - name: Email test report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          to: ${{ secrets.EMAIL_TO }}
          from: Campus Portal CI
          subject: "Campus Portal CI - ${{ steps.pytest.outcome }}"
          body: |
            Campus Portal CI test report

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit ID: ${{ github.sha }}
            Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Test outcome: ${{ steps.pytest.outcome }}

            The attached JSON file contains the detailed pytest report.
          attachments: pytest-report.json

      - name: Fail job if tests failed
        if: steps.pytest.outcome != 'success'
        run: exit 1

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
